[paths]
project_dir = "."
database = "case.sqlite"
originals = "originals"
cache = "cache"
logs = "logs"

[gateway]
url = "http://llm-gateway-api:8000"
client_name = "document_store"
# API key is read from the LLM_GATEWAY_KEY environment variable, never stored here

[models]
embedding = "bge-m3"
extraction = "qwen2.5:7b-instruct"
generation = "qwen2.5:7b-instruct"

[chunking]
max_chars = 2000
overlap_chars = 200

[ocr]
confidence_threshold = 0.6

[models]
embedding = "bge-m3"
embedding_dimensions = 1024
extraction = "qwen2.5:7b-instruct"
generation = "qwen2.5:7b-instruct"

[classification]
# Rules are evaluated in order; the first match wins. Patterns are
# gitignore-style globs matched against the path relative to originals/,
# case-insensitive. Unmatched files receive default_doc_class.

# Folder names in these rules must match the originals/ structure
# described in README.md ("Originals Folder Structure").

default_doc_class = "other"


[[classification.rules]]
doc_class = "in_camera"
pattern = "in_camera/**"

[[classification.rules]]
doc_class = "financial_statement"
pattern = "**/bank_statement*"

[[classification.rules]]
doc_class = "receipt"
pattern = "**/receipt*"

[[classification.rules]]
doc_class = "court_filing"
pattern = "court_filings/**"

[[classification.rules]]
doc_class = "correspondence"
pattern = "correspondence/**"

[routing]
# Every doc_class must have an entry. in_camera is always forced to
# local_only regardless of what is configured here (see constants.py).
in_camera = "local_only"
financial_statement = "external"
receipt = "standard"
court_filing = "standard"
correspondence = "standard"
other = "local_only"