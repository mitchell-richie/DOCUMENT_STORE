[project]
name = "document-store"
version = "0.1.0"
description = "Single-user, local-first case document management system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "paddleocr==3.7.0",
    "paddlepaddle>=3.3.1",
    "sqlite-vec>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_store"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: requires PaddleOCR models; slow, downloads on first run",
]
